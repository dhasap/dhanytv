name: Auto Update IPTV Playlist

on:
  schedule:
    # Daily at 00:00 UTC (07:00 WIB). Each run re-downloads fresh EPG sources, so
    # running daily keeps the programme guide from going stale between rebuilds.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      allow_big_drop:
        description: "Izinkan commit walau channel/EPG turun drastis (mis. bersih-bersih sengaja)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check update scripts
        run: |
          # Fail fast on broken Python before touching the playlist — prevents
          # SyntaxError/NameError mid-pipeline (happened 2026-08-28).
          python3 -m py_compile update-script/*.py
          echo "All update scripts compile OK"

      - name: Download Latest Source
        env:
          SRC: ${{ secrets.PLAYLIST_SOURCE }}
          SRC2: ${{ secrets.PLAYLIST_SOURCE_2 }}
        run: |
          if [ -z "$SRC" ]; then
            echo "ERROR: Secret PLAYLIST_SOURCE belum diset!"
            exit 1
          fi
          echo "Mengunduh data terbaru..."
          # -f: HTTP >=400 harus gagal, kalau tidak HTML error tersimpan sebagai playlist.
          curl -sSfL "$SRC" -o source_latest.m3u
          # Secondary source (URL kept only in the PLAYLIST_SOURCE_2 secret).
          # Appended to the combined source so merge_source.py ingests both.
          if [ -n "$SRC2" ]; then
            echo "Mengunduh sumber sekunder..."
            # Unduh ke file sementara dulu: curl exit 0 juga pada HTTP 404/500,
            # jadi validasi isi sebelum ditempel ke source_latest.m3u.
            if curl -sSfL "$SRC2" -o src2.tmp && grep -q '^#EXTM3U' src2.tmp; then
              printf '\n' >> source_latest.m3u
              cat src2.tmp >> source_latest.m3u
              echo "Sumber sekunder ditambahkan ($(grep -c '#EXTINF' src2.tmp || true) entri)."
            else
              echo "WARNING: sumber sekunder gagal/tidak valid (dilewati)."
            fi
            rm -f src2.tmp
          fi
          echo "Download selesai. Ukuran file: $(wc -c < source_latest.m3u) bytes"
          # Validate: file must be non-empty and start with #EXTM3U (not HTML error page)
          if [ ! -s source_latest.m3u ]; then
            echo "ERROR: File sumber kosong!"
            exit 1
          fi
          if ! head -1 source_latest.m3u | grep -q '#EXTM3U'; then
            echo "ERROR: File sumber bukan playlist M3U yang valid (tidak diawali #EXTM3U)."
            echo "  Header pertama: $(head -1 source_latest.m3u | head -c 120)"
            exit 1
          fi
          echo "Validasi sumber: OK"

      - name: Merge & Fix Playlist
        timeout-minutes: 10
        env:
          SANITIZE_PATTERNS: ${{ secrets.SANITIZE_PATTERNS }}
        run: |
          TARGET_FILE="dhanytv.m3u"
          SOURCE_FILE="source_latest.m3u"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "ERROR: File $TARGET_FILE tidak ditemukan!"
            exit 1
          fi
          if [ ! -f "$SOURCE_FILE" ]; then
            echo "ERROR: File sumber gagal diunduh!"
            exit 1
          fi

          OLD_COUNT=$(grep -c '#EXTINF' "$TARGET_FILE" || echo "0")
          echo "Channel sebelum: $OLD_COUNT"

          SANITIZE_ARG=()
          if [ -n "$SANITIZE_PATTERNS" ]; then
            SANITIZE_ARG=(--sanitize "$SANITIZE_PATTERNS")
          fi

          python3 update-script/merge_source.py "$SOURCE_FILE" --target "$TARGET_FILE" "${SANITIZE_ARG[@]}"

          rm -f "$SOURCE_FILE"
          AFTER=$(grep -c '#EXTINF' "$TARGET_FILE" || echo "0")
          echo "Channel setelah merge: $AFTER"

      - name: Early Cleanup (remove dead-channel dupes before extra injection)
        run: |
          echo "=== Early cleanup: removing dead-channel duplicates ==="
          python3 update-script/cleanup_playlist.py dhanytv.m3u --write || true

      - name: Inject Curated Extra Channels (World Cup, events)
        run: |
          echo "=== Injecting curated extra channels (update-script/extra_channels.m3u) ==="
          BEFORE=$(grep -c '#EXTINF' dhanytv.m3u || true); BEFORE=${BEFORE:-0}
          python3 update-script/merge_extra.py --ci
          AFTER=$(grep -c '#EXTINF' dhanytv.m3u || true); AFTER=${AFTER:-0}
          echo "Extra channels: $((AFTER - BEFORE)) injected (total: $AFTER)"

      - name: Merge International Channels (iptv-org)
        timeout-minutes: 20
        run: |
          echo "=== Merging international channels from iptv-org ==="
          # grep -c tetap mencetak "0" lalu exit 1 saat tidak ada match;
          # "|| echo 0" menghasilkan "0\n0" dan bikin $(( )) error.
          BEFORE=$(grep -c '#EXTINF' dhanytv.m3u || true); BEFORE=${BEFORE:-0}
          python3 update-script/merge_international.py --ci
          AFTER=$(grep -c '#EXTINF' dhanytv.m3u || true); AFTER=${AFTER:-0}
          ADDED=$((AFTER - BEFORE))
          echo "International channels: $ADDED added (total: $AFTER)"

      - name: Merge astatv Channels (extra source)
        run: |
          echo "=== Merging channels from astatv API (astatv.karaa.web.id) ==="
          BEFORE=$(grep -c '#EXTINF' dhanytv.m3u || echo "0")
          python3 update-script/merge_astatv.py dhanytv.m3u \
            --base "https://astatv.karaa.web.id" \
            --prefer-astatv \
            --replace-hosts "mncmedia.malingtv.workers.dev,proxy-v.rctiplus.id" \
            --report astatv_report.json || {
              echo "WARNING: merge astatv gagal, lanjut tanpa sumber ini"
            }
          AFTER=$(grep -c '#EXTINF' dhanytv.m3u || echo "0")
          echo "astatv: total channel sekarang $AFTER (sebelum $BEFORE)"

      - name: Prune dead astatv rows
        timeout-minutes: 20
        run: |
          echo "=== Buang baris astatv yang manifest-nya kosong/mati ==="
          python3 update-script/check_playlist.py dhanytv.m3u --only astatv.karaa.web.id \
            --workers 12 --out /tmp/astatv_check.json || true
          if [ -f /tmp/astatv_check.json ]; then
            python3 update-script/repair_playlist.py dhanytv.m3u /tmp/astatv_check.json --write --max-drop-pct 25 \
              --report /tmp/astatv_repair.json || echo "WARN: repair astatv dilewati"
          fi

      - name: Prune dead channels (full liveness pass)
        timeout-minutes: 45
        run: |
          echo "=== Uji semua entri, buang yang benar-benar mati ==="
          python3 update-script/check_playlist.py dhanytv.m3u --workers 12 \
            --out /tmp/full_check.json || true
          if [ -f /tmp/full_check.json ]; then
            python3 update-script/repair_playlist.py dhanytv.m3u /tmp/full_check.json \
              --write --safe-only --max-drop-pct 25 --report /tmp/repair_report.json || echo "WARN: repair dilewati"
          fi

      - name: Normalize channel groups
        run: |
          echo "=== Rapikan nama grup (gabung duplikat, buang grup sampah) ==="
          python3 update-script/normalize_groups.py dhanytv.m3u --write

      - name: Tag DASH entries served as .m3u8
        timeout-minutes: 15
        run: |
          echo "=== Tandai entri DASH (astatv menyajikan MPD di path .m3u8) ==="
          python3 update-script/tag_dash.py dhanytv.m3u --write || echo "WARN: tag dash dilewati"

      - name: Fix ClearKey license keys
        env:
          FIX_CLEARKEY_URLS: "${{ secrets.PLAYLIST_SOURCE_2 }}"
        run: |
          echo "=== Fixing ClearKey keys ==="
          python3 update-script/fix_clearkeys.py dhanytv.m3u

      - name: Apply protected sources (hasil harvest)
        run: |
          echo "=== Apply protected sources ==="
          python3 update-script/apply_protected.py dhanytv.m3u --report protected_report.json
          cat protected_report.json

      - name: Normalize M3U tags (kompatibilitas player)
        run: |
          echo "=== Normalize M3U tags ==="
          python3 update-script/fix_tags.py dhanytv.m3u /tmp/dh_tags.m3u --apply --add-inputstream
          mv /tmp/dh_tags.m3u dhanytv.m3u

      - name: Clean Playlist & Generate OTT Variant
        env:
          SANITIZE_PATTERNS: ${{ secrets.SANITIZE_PATTERNS }}
        run: |
          echo "=== Clean Playlist & Generate OTT Variant ==="
          SANITIZE_ARG=()
          if [ -n "$SANITIZE_PATTERNS" ]; then
            SANITIZE_ARG=(--sanitize "$SANITIZE_PATTERNS")
          fi
          python3 update-script/cleanup_playlist.py dhanytv.m3u --write --ott-output dhanytv-ott.m3u --check "${SANITIZE_ARG[@]}"
          # Re-fix ClearKeys after final cleanup
          FIX_CLEARKEY_URLS="${{ secrets.PLAYLIST_SOURCE_2 }}" python3 update-script/fix_clearkeys.py dhanytv.m3u
          echo "Playlist channels : $(grep -c '#EXTINF' dhanytv.m3u || echo '0')"
          echo "OTT channels      : $(grep -c '#EXTINF' dhanytv-ott.m3u || echo '0')"
          # Validate OTT: must not contain active .mpd (DASH) URLs
          DASH_IN_OTT=$(grep -v '^#' dhanytv-ott.m3u | grep -c '\.mpd' || true)
          if [ "$DASH_IN_OTT" -gt 0 ]; then
            echo "ERROR: OTT playlist mengandung $DASH_IN_OTT channel DASH (.mpd)!"
            echo "  cleanup_playlist.py seharusnya membuang semua DASH dari OTT."
            exit 1
          fi
          echo "OTT validation: OK (0 DASH channels)"

      - name: Apply protected sources (final pass)
        run: |
          echo "=== Apply protected sources (final, setelah cleanup) ==="
          python3 update-script/apply_protected.py dhanytv.m3u --report protected_report_final.json
          cat protected_report_final.json

      - name: Lint kompatibilitas M3U (laporan)
        run: |
          echo "=== Lint kompatibilitas ==="
          python3 update-script/compat_check.py dhanytv.m3u --epg epg.xml || true

      - name: Re-fix ClearKeys after cleanup
        run: |
          echo "=== Re-fixing ClearKeys after cleanup ==="
          BEFORE=$(grep -c 'license_key=' dhanytv.m3u || echo 0)
          python3 update-script/fix_clearkeys.py dhanytv.m3u
          AFTER=$(grep -c 'license_key=' dhanytv.m3u || echo 0)
          echo "ClearKey entries: $BEFORE -> $AFTER"

      - name: Verify critical ClearKey keys
        timeout-minutes: 20
        run: |
          echo "=== Verifying critical ClearKey keys ==="
          python3 update-script/verify_keys.py dhanytv.m3u
          echo "Key verification complete"

      - name: Normalisasi akhir M3U (tag order + dedupe id)
        run: |
          python3 update-script/fix_tags.py dhanytv.m3u /tmp/m3u_final.m3u --apply --add-inputstream
          mv /tmp/m3u_final.m3u dhanytv.m3u
          python3 update-script/fix_tags.py dhanytv-ott.m3u /tmp/ott_final.m3u --apply
          mv /tmp/ott_final.m3u dhanytv-ott.m3u
          echo "entri: $(grep -c '#EXTINF' dhanytv.m3u)"

      - name: Validate ClearKey entries (drop revoked keys)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 update-script/validate_clearkeys.py dhanytv.m3u --write || echo "WARN: clearkey validation skipped"

      - name: Download EPG Sources (Multi-Source)
        timeout-minutes: 15
        run: |
          echo "=== Downloading EPG sources ==="
          FAIL_COUNT=0

          # AqFad2811/epg (primary)
          # NOTE: epg.xml renamed to aqfad_epg.xml to avoid collision with output
          AQFAD_BASE="https://raw.githubusercontent.com/AqFad2811/epg/refs/heads/main"
          for f in indonesia.xml astro.xml singapore.xml rtmklik.xml unifitv.xml sooka.xml; do
            echo "  AqFad: $f"
            curl -sL "${AQFAD_BASE}/${f}" -o "${f}" || { echo "  WARNING: $f gagal"; FAIL_COUNT=$((FAIL_COUNT+1)); }
          done
          echo "  AqFad: epg.xml -> aqfad_epg.xml"
          curl -sL "${AQFAD_BASE}/epg.xml" -o "aqfad_epg.xml" || { echo "  WARNING: aqfad_epg.xml gagal"; FAIL_COUNT=$((FAIL_COUNT+1)); }

          # epgshare01.online (gzipped, daily updated)
          EPGSHARE_BASE="https://epgshare01.online/epgshare01"
          for f in ID1 SG1 MY1 CA2 IT1 FR1 AE1 IN1 ALJAZEERA1 PL1 CZ1; do
            echo "  epgshare01: $f"
            curl -sL "${EPGSHARE_BASE}/epg_ripper_${f}.xml.gz" -o "epgshare01_${f}.xml.gz"
            if gunzip -f "epgshare01_${f}.xml.gz" 2>/dev/null; then
              echo "    OK: $(wc -c < epgshare01_${f}.xml) bytes"
            else
              echo "  WARNING: $f gunzip gagal"
              rm -f "epgshare01_${f}.xml.gz"
              FAIL_COUNT=$((FAIL_COUNT+1))
            fi
          done

          # open-epg.com
          echo "  open-epg: indonesia.xml"
          curl -sL "https://www.open-epg.com/files/indonesia.xml" -o "open_epg_indonesia.xml" || { echo "  WARNING: open-epg gagal"; FAIL_COUNT=$((FAIL_COUNT+1)); }

          echo "EPG sources downloaded. Failures: $FAIL_COUNT"
          if [ "$FAIL_COUNT" -ge 10 ]; then
            echo "ERROR: Too many EPG source failures ($FAIL_COUNT), aborting."
            exit 1
          fi

      - name: Generate Custom EPG
        timeout-minutes: 20
        run: |
          echo "=== Generate Custom EPG ==="
          python3 update-script/generate_epg.py \
            --m3u dhanytv.m3u \
            --output epg.xml \
            --sources \
              epgshare01_ID1.xml epgshare01_SG1.xml epgshare01_MY1.xml \
              epgshare01_CA2.xml epgshare01_IT1.xml epgshare01_FR1.xml \
              epgshare01_AE1.xml epgshare01_IN1.xml epgshare01_ALJAZEERA1.xml \
              epgshare01_PL1.xml epgshare01_CZ1.xml \
              open_epg_indonesia.xml \
              indonesia.xml astro.xml singapore.xml rtmklik.xml unifitv.xml \
              aqfad_epg.xml sooka.xml

          # Cleanup source files ONLY (not output epg.xml!)
          rm -f indonesia.xml astro.xml singapore.xml rtmklik.xml unifitv.xml sooka.xml
          rm -f aqfad_epg.xml epgshare01_*.xml open_epg_indonesia.xml

          if [ -f "epg.xml" ] && [ -s "epg.xml" ]; then
            echo "Custom EPG generated: $(du -h epg.xml | cut -f1)"
            echo "EPG channels: $(grep -c '<channel ' epg.xml)"
            echo "EPG programmes: $(grep -c '<programme ' epg.xml)"
          else
            echo "ERROR: Custom EPG gagal di-generate!"
            exit 1
          fi

      - name: Ensure EPG covers every channel
        timeout-minutes: 10
        run: |
          echo "=== Melengkapi EPG untuk channel yang belum tercakup ==="
          python3 update-script/append_epg.py dhanytv.m3u epg.xml --assign-ids --prune --write
          echo "EPG channels: $(grep -c '<channel ' epg.xml)"
          echo "EPG programmes: $(grep -c '<programme ' epg.xml)"

      - name: Safety Gate (cegah penghapusan channel/EPG tidak sengaja)
        env:
          ALLOW_BIG_DROP: ${{ inputs.allow_big_drop || 'false' }}
        run: |
          echo "=== Safety gate: memverifikasi tidak ada yang terhapus tidak sengaja ==="
          OLD_CH=$(git show HEAD:dhanytv.m3u 2>/dev/null | grep -c '#EXTINF' || true); OLD_CH=${OLD_CH:-0}
          NEW_CH=$(grep -c '#EXTINF' dhanytv.m3u || true); NEW_CH=${NEW_CH:-0}
          OLD_PROG=$(git show HEAD:epg.xml 2>/dev/null | grep -c '<programme ' || true); OLD_PROG=${OLD_PROG:-0}
          NEW_PROG=$(grep -c '<programme ' epg.xml || true); NEW_PROG=${NEW_PROG:-0}
          OTT_CH=$(grep -c '#EXTINF' dhanytv-ott.m3u 2>/dev/null || true); OTT_CH=${OTT_CH:-0}
          OLD_OTT=$(git show HEAD:dhanytv-ott.m3u 2>/dev/null | grep -c '#EXTINF' || true); OLD_OTT=${OLD_OTT:-0}
          DUPES=$(grep -v '^#' dhanytv.m3u | sort | uniq -d | wc -l)
          echo "Channels: $OLD_CH -> $NEW_CH | OTT: $OLD_OTT -> $OTT_CH | EPG programmes: $OLD_PROG -> $NEW_PROG | URL ganda: $DUPES"

          fail=0

          # 1. Lantai absolut.
          if [ "$NEW_CH" -lt 600 ]; then
            echo "ERROR: Channel terlalu sedikit ($NEW_CH < 600). Kemungkinan source gagal."
            fail=1
          fi
          if [ "$OTT_CH" -lt 400 ]; then
            echo "ERROR: OTT terlalu sedikit ($OTT_CH < 400)."
            fail=1
          fi

          # 2. Penurunan relatif: batas keras, bukan peringatan.
          if [ "$OLD_CH" -gt 0 ]; then
            MIN_CH=$((OLD_CH * 80 / 100))
            if [ "$NEW_CH" -lt "$MIN_CH" ]; then
              echo "ERROR: Channel turun >20% ($OLD_CH -> $NEW_CH, batas $MIN_CH)."
              fail=1
            fi
          fi
          if [ "$OLD_OTT" -gt 0 ] && [ "$OTT_CH" -lt $((OLD_OTT * 80 / 100)) ]; then
            echo "ERROR: OTT turun >20% ($OLD_OTT -> $OTT_CH)."
            fail=1
          fi

          # EPG tidak memblokir playlist: kalau sumber EPG yang rusak, pakai epg.xml lama.
          EPG_BAD=0
          [ "$NEW_PROG" -lt 3000 ] && EPG_BAD=1
          [ "$OLD_PROG" -gt 0 ] && [ "$NEW_PROG" -lt $((OLD_PROG * 70 / 100)) ] && EPG_BAD=1
          if [ "$EPG_BAD" -eq 1 ]; then
            if [ "$ALLOW_BIG_DROP" = "true" ]; then
              echo "PERINGATAN: EPG programme turun >30% ($OLD_PROG -> $NEW_PROG), tetap dipakai."
            else
              echo "PERINGATAN: EPG programme turun >30% ($OLD_PROG -> $NEW_PROG)."
              echo "  -> epg.xml dikembalikan ke versi HEAD; playlist tetap dikomit."
              git checkout HEAD -- epg.xml
              NEW_PROG=$OLD_PROG
            fi
          fi

          # 3. Sanity struktural.
          if [ "$DUPES" -gt 50 ]; then
            echo "ERROR: $DUPES URL ganda di playlist."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            if [ "$ALLOW_BIG_DROP" = "true" ]; then
              echo "PERINGATAN: gate gagal tapi allow_big_drop=true — commit dilanjutkan."
            else
              echo "SAFETY GATE GAGAL: tidak ada commit. Perbaiki sumbernya,"
              echo "atau jalankan workflow_dispatch dengan allow_big_drop=true bila penurunan memang disengaja."
              exit 1
            fi
          fi
          echo "Safety gate passed."

      - name: Check for Changes
        id: check_changes
        run: |
          CHANGED_FILES=$(git status --porcelain -- dhanytv.m3u dhanytv-ott.m3u epg.xml update-script/)
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES"
            git diff --stat dhanytv.m3u dhanytv-ott.m3u epg.xml update-script/ || true
          fi

      - name: Commit and Push Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dhanytv.m3u dhanytv-ott.m3u epg.xml update-script/
          COMMIT_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          CHANNEL_COUNT=$(grep -c '#EXTINF' dhanytv.m3u || echo "0")
          OTT_CHANNEL_COUNT=$(grep -c '#EXTINF' dhanytv-ott.m3u 2>/dev/null || echo "0")
          EPG_CHANNELS=$(grep -c '<channel ' epg.xml 2>/dev/null || echo "0")
          git commit -m "auto-update: Playlist + OTT + EPG ($CHANNEL_COUNT ch, $OTT_CHANNEL_COUNT OTT, $EPG_CHANNELS EPG) - $COMMIT_DATE"
          git push

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "  Auto-Update IPTV Playlist + EPG"
          echo "============================================"
          echo "Tanggal   : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Channel   : $(grep -c '#EXTINF' dhanytv.m3u 2>/dev/null || echo 'N/A')"
          echo "OTT Ch    : $(grep -c '#EXTINF' dhanytv-ott.m3u 2>/dev/null || echo 'N/A')"
          echo "EPG Ch    : $(grep -c '<channel ' epg.xml 2>/dev/null || echo 'N/A')"
          echo "EPG Size  : $(du -h epg.xml 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "Perubahan : ${{ steps.check_changes.outputs.has_changes }}"
          echo "============================================"
